name: one-shot-comments

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix stale comments
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib

          def rewrite(path, old, new):
              p = pathlib.Path(path)
              text = p.read_text()
              assert old in text, f"anchor missing in {path}"
              p.write_text(text.replace(old, new, 1))

          rewrite(
              "bridge-models/src/main/kotlin/io/chibi/bridge/models/Ipc.kt",
              "    /** Runtime host package shipped with this project (AnymeX host lineage). */",
              "    /**\n"
              "     * Runtime host package shipped with this project. Deliberately distinct from\n"
              "     * AnymeX's own `com.anymex.runtimehost` bridge so the two can coexist.\n"
              "     */",
          )

          rewrite(
              "runtime-loader/src/main/kotlin/io/chibi/bridge/loader/HostDiscovery.kt",
              "     * All runtime hosts installed on the device. The AnymeX-derived host keeps\n"
              "     * the original package id so existing installations keep working.",
              "     * All runtime hosts installed on the device. Only this project's host package\n"
              "     * is probed; AnymeX's separate `com.anymex.runtimehost` bridge is never touched.",
          )

          rewrite(
              "runtime-loader/src/main/kotlin/io/chibi/bridge/loader/RuntimeLoader.kt",
              "    /** Default entry point of the runtime host APK (unchanged from upstream). */",
              "    /** Default entry point of this project's runtime host APK. */",
          )
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Clarify that the runtime host package is this project's own"
          git push origin HEAD:main

      - name: Remove this one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-comments.yml
          git commit -m "Remove the one-shot comments workflow"
          git push origin HEAD:main
