name: one-shot-bump

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump the host version
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib

          def rewrite(path, old, new):
              p = pathlib.Path(path)
              text = p.read_text()
              assert old in text, f"anchor missing in {path}"
              p.write_text(text.replace(old, new, 1))

          rewrite(
              "runtime-host/build.gradle.kts",
              '?: "2.0.0-chibi"',
              '?: "2.0.1-chibi"',
          )

          rewrite(
              "runtime-host/src/main/kotlin/io/chibi/runtimehost/HostBridge.kt",
              'const val VERSION_NAME = "2.0.0-chibi"',
              'const val VERSION_NAME = "2.0.1-chibi"',
          )
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Bump the runtime host to 2.0.1"
          git push origin HEAD:main

      - name: Remove this one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-bump.yml
          git commit -m "Remove the one-shot bump workflow"
          git push origin HEAD:main
