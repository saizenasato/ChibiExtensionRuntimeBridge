name: Release bridge app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for example v0.1.0). Created if it does not exist.'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve tag
        id: vars
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [ -z "$TAG" ]; then echo "No tag resolved" >&2; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Release signing is optional: configure the four repository secrets below
      # to get signed APKs, otherwise release builds are produced unsigned.
      - name: Configure signing (optional)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.CHIBI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CHIBI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CHIBI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CHIBI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No keystore secret configured - building unsigned release artifacts."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/chibi.jks"
          {
            echo "storeFile=$RUNNER_TEMP/keystore/chibi.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble release artifacts
        run: |
          ./gradlew \
            :runtime-host:assembleRelease \
            :sample-host:assembleRelease \
            :bridge-sdk:assembleRelease \
            :bridge-api:assembleRelease \
            :bridge-models:assembleRelease \
            --stacktrace
        env:
          CHIBI_VERSION_NAME: ${{ steps.vars.outputs.version }}
          CHIBI_VERSION_CODE: ${{ github.run_number }}

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${{ steps.vars.outputs.version }}"
          host_apk=$(find runtime-host/build/outputs/apk/release -name '*.apk' | head -1)
          sample_apk=$(find sample-host/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$host_apk" "dist/chibi-runtime-host-${VERSION}.apk"
          [ -n "$sample_apk" ] && cp "$sample_apk" "dist/chibi-sample-host-${VERSION}.apk" || true
          for aar in bridge-sdk bridge-api bridge-models; do
            f=$(find "$aar/build/outputs/aar" -name '*-release.aar' | head -1)
            [ -n "$f" ] && cp "$f" "dist/${aar}-${VERSION}.aar" || true
          done
          (cd dist && sha256sum ./* > SHA256SUMS.txt)
          ls -l dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "ChibiExtensionRuntimeBridge $TAG" \
            --notes "Runtime host APK, sample host APK and Kotlin SDK AARs built from ${{ github.sha }}."
          gh release upload "$TAG" dist/* --clobber

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.vars.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
