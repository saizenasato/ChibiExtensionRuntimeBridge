      - name: Assemble artifacts
        run: |
          set +e
          ./gradlew \
            :runtime-host:assembleDebug :runtime-host:assembleRelease \
            :bridge-sdk:assembleRelease :bridge-api:assembleRelease :bridge-models:assemble \
            :sample-host:assembleDebug \
            --continue --stacktrace 2>&1 | tee /tmp/assemble.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            strip_paths() { sed -E 's#file:///home/runner/work/ChibiExtensionRuntimeBridge/ChibiExtensionRuntimeBridge/##'; }
            {
              grep -E '^e: |^error:|What went wrong|Execution failed|FAILURE|^\* |Caused by|^> Task .*FAILED|^\s+> ' /tmp/assemble.log | strip_paths | head -250
              echo '==== LOG TAIL ===='
              tail -n 200 /tmp/assemble.log | strip_paths
            } > /tmp/build-errors.txt
            git config user.name 'chibi-ci'
            git config user.email 'ci@users.noreply.github.com'
            git checkout -q -B ci-logs
            cp /tmp/build-errors.txt build-errors.txt
            git add -f build-errors.txt
            git commit -q -m 'CI: assemble error list'
            git push -f -q origin ci-logs:ci-logs || true
            git checkout -q -- . || true
          fi
          exit "$status"
