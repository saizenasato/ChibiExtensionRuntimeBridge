name: one-shot-rename

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply the runtime host package rename
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib

          readme = pathlib.Path("README.md")
          text = readme.read_text()
          old = "* Runtime host: `com.anymex.runtimehost` (kept for extension binary compatibility)"
          new = (
              "* Runtime host: `io.chibi.runtimehost` \u2014 this project's own package id, deliberately\n"
              "  different from AnymeX's `com.anymex.runtimehost` so both bridges can be installed\n"
              "  on the same device without replacing each other"
          )
          assert old in text, "README anchor missing"
          readme.write_text(text.replace(old, new, 1))

          lic = pathlib.Path("docs/LICENSE_COMPLIANCE.md")
          text = lic.read_text()
          old = (
              "   the host (`com.anymex.runtimehost`) are retained solely so that existing\n"
              "   extension APKs link at runtime; this does not imply endorsement by those\n"
              "   projects."
          )
          new = (
              "   Keiyoushi (`keiyoushi.*`) are retained solely so that existing extension APKs\n"
              "   link at runtime; this does not imply endorsement by those projects. This\n"
              "   project's own runtime host uses `io.chibi.runtimehost`, an id distinct from\n"
              "   AnymeX's `com.anymex.runtimehost`, so neither bridge replaces the other."
          )
          assert old in text, "LICENSE_COMPLIANCE anchor missing"
          lic.write_text(text.replace(old, new, 1))
          PY

          mkdir -p backends/aniyomi/src/main/kotlin/io/chibi/runtimehost
          git mv backends/aniyomi/src/main/kotlin/com/anymex/runtimehost/aniyomi backends/aniyomi/src/main/kotlin/io/chibi/runtimehost/aniyomi
          git mv backends/aniyomi/src/main/kotlin/com/anymex/runtimehost/network backends/aniyomi/src/main/kotlin/io/chibi/runtimehost/network

          mkdir -p backends/cloudstream/src/main/kotlin/io/chibi/runtimehost
          git mv backends/cloudstream/src/main/kotlin/com/anymex/runtimehost/cloudstream backends/cloudstream/src/main/kotlin/io/chibi/runtimehost/cloudstream

          mkdir -p backends/kotatsu/src/main/kotlin/io/chibi/runtimehost
          git mv backends/kotatsu/src/main/kotlin/com/anymex/runtimehost/kotatsu backends/kotatsu/src/main/kotlin/io/chibi/runtimehost/kotatsu

          mkdir -p runtime-core/src/main/kotlin/io/chibi/runtimehost
          git mv runtime-core/src/main/kotlin/com/anymex/runtimehost/ActivityResolver.kt runtime-core/src/main/kotlin/io/chibi/runtimehost/ActivityResolver.kt
          git mv runtime-core/src/main/kotlin/com/anymex/runtimehost/Logger.kt runtime-core/src/main/kotlin/io/chibi/runtimehost/Logger.kt

          git ls-files -z \
            | grep -zv -e '^README\.md$' -e '^docs/LICENSE_COMPLIANCE\.md$' -e '^\.github/' \
            | xargs -0 grep -lZ 'com\.anymex\.runtimehost' \
            | xargs -0 -r sed -i 's/com\.anymex\.runtimehost/io.chibi.runtimehost/g'

          if grep -rn 'com\.anymex\.runtimehost' --exclude-dir=.git --exclude-dir=.github . \
              | grep -v -e '^\./README\.md:' -e '^\./docs/LICENSE_COMPLIANCE\.md:'; then
            echo "leftover com.anymex.runtimehost references"
            exit 1
          fi

          git add -A
          git diff --cached --stat

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Give the runtime host its own package id instead of AnymeX's"
          git push origin HEAD:main

      - name: Remove this one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-rename.yml
          git commit -m "Remove the one-shot rename workflow"
          git push origin HEAD:main
