name: Import sources

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: Archive URL
        required: true
      archive_sha256:
        description: Archive SHA-256
        required: true
      message:
        description: Commit message
        required: false
        default: Import the ported sources

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download archive
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 -o /tmp/sources.tar.xz "$ARCHIVE_URL"
          echo "$ARCHIVE_SHA256  /tmp/sources.tar.xz" | sha256sum -c -

      - name: Replace worktree and push
        env:
          MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/src
          tar -xJf /tmp/sources.tar.xz -C /tmp/src
          git config user.name chibi-ci
          git config user.email ci@users.noreply.github.com
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/src/. .
          git add -A
          if git diff --cached --quiet; then
            echo 'Archive matches main already'
          else
            git commit -q -m "$MESSAGE"
            git push origin HEAD:main
          fi

      - name: Trigger build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run artifact.yml --ref main
