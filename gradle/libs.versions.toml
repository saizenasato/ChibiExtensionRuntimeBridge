[versions]
agp = "8.12.3"
kotlin = "2.1.0"
coroutines = "1.10.2"
serialization = "1.7.3"
okhttp = "5.3.2"
okio = "3.17.0"
jsoup = "1.21.1"
nanohttpd = "2.3.1"
injekt = "1.16.1"
quickjs = "0.9.2"
rhino = "1.7.15"
appcompat = "1.6.1"
preference = "1.2.1"
coreKtx = "1.16.0"
composeRuntime = "1.8.3"
gson = "2.11.0"
jackson = "2.15.2"
rxjava = "1.3.8"
rxandroid = "1.2.1"
newpipe = "v0.24.4"
retrofit = "2.11.0"
tmdb = "2.10.0"
fuzzywuzzy = "1.4.0"
nicehttp = "0.4.16"
androidxAnnotation = "1.8.1"
collectionKtx = "1.4.4"
json = "20251224"
junit = "4.13.2"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "serialization" }
kotlinx-serialization-json-okio = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-okio", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-doh = { module = "com.squareup.okhttp3:okhttp-dnsoverhttps", version.ref = "okhttp" }
okhttp-brotli = { module = "com.squareup.okhttp3:okhttp-brotli", version.ref = "okhttp" }
okhttp-zstd = { module = "com.squareup.okhttp3:okhttp-zstd", version.ref = "okhttp" }
okhttp-android = { module = "com.squareup.okhttp3:okhttp-android", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
injekt = { module = "uy.kohesive.injekt:injekt-core", version.ref = "injekt" }
quickjs = { module = "app.cash.quickjs:quickjs-android", version.ref = "quickjs" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-preference = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime-android", version.ref = "composeRuntime" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-collection-ktx = { module = "androidx.collection:collection-ktx", version.ref = "collectionKtx" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
rxjava = { module = "io.reactivex:rxjava", version.ref = "rxjava" }
rxandroid = { module = "io.reactivex:rxandroid", version.ref = "rxandroid" }
newpipe = { module = "com.github.TeamNewPipe:NewPipeExtractor", version.ref = "newpipe" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-jackson = { module = "com.squareup.retrofit2:converter-jackson", version.ref = "retrofit" }
tmdb = { module = "com.uwetrottmann.tmdb2:tmdb-java", version.ref = "tmdb" }
fuzzywuzzy = { module = "me.xdrop:fuzzywuzzy", version.ref = "fuzzywuzzy" }
nicehttp = { module = "com.github.Blatzar:NiceHttp", version.ref = "nicehttp" }
org-json = { module = "org.json:json", version.ref = "json" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
